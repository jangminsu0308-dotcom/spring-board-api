spring.application.name=demo

spring.datasource.url=jdbc:mysql://localhost:3306/springdb?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=DB_name
spring.datasource.password=DB_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.api-docs.path=/v3/api-docs

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

server.port=8080

jwt.secret=CHANGE_ME_TO_A_RANDOM_BASE64_SECRET_AT_LEAST_32_BYTES
jwt.expiration-ms=3600000
jwt.refresh-expiration-ms=604800000

# index.html이 인라인 CSS/JS를 포함한 단일 파일이라 용량이 꽤 크다 — 별도 번들러 없이도
# gzip으로 압축해 네트워크로 나가는 바이트 수를 줄인다.
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,application/json
server.compression.min-response-size=1024

# 게시글 첨부 이미지. app.upload-dir은 상대경로면 실행 디렉터리(도커에서는 WORKDIR인 /app)
# 기준으로 풀린다 — 그래서 로컬 실행과 컨테이너 실행이 같은 기본값을 그대로 써도 된다.
app.upload-dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
