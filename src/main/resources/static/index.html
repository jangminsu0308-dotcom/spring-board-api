<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>게시판</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%232f6f4f'/%3E%3Ctext x='16' y='23' font-family='system-ui,sans-serif' font-size='18' font-weight='700' fill='white' text-anchor='middle'%3EB%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<style>
  @font-face {
    font-family: 'Pretendard';
    src: url('https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/woff2/PretendardVariable.woff2') format('woff2-variations');
    font-weight: 45 920;
  }
  :root {
    --bg: #f6f6f3;
    --card: #ffffff;
    --card-hover: #fdfdfb;
    --border: #e6e5e0;
    --text: #1c1c1a;
    --muted: #767670;
    --accent: #2f6f4f;
    --accent-soft: #eaf3ee;
    --accent-hover: #24593f;
    --danger: #b3432b;
    --danger-hover: #8f351f;
    --input-bg: #ffffff;
    --hover-bg: #efefe9;
    --shadow: 0 1px 2px rgba(20, 20, 15, 0.04), 0 6px 16px rgba(20, 20, 15, 0.05);
    --shadow-hover: 0 2px 4px rgba(20, 20, 15, 0.06), 0 10px 24px rgba(20, 20, 15, 0.09);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17171a;
      --card: #202024;
      --card-hover: #24242a;
      --border: #303036;
      --text: #ecece8;
      --muted: #93938c;
      --accent: #4fa377;
      --accent-soft: #1c2c25;
      --accent-hover: #63b88a;
      --danger: #d9694d;
      --danger-hover: #e58267;
      --input-bg: #26262b;
      --hover-bg: #2a2a30;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 6px 16px rgba(0, 0, 0, 0.28);
      --shadow-hover: 0 2px 4px rgba(0, 0, 0, 0.24), 0 10px 24px rgba(0, 0, 0, 0.36);
    }
  }
  * { box-sizing: border-box; }
  ::selection { background: var(--accent); color: #fff; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 999px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--muted); }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Malgun Gothic", sans-serif;
    padding: 32px 16px 72px;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .wrap { max-width: 720px; margin: 0 auto; }

  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 2px; }
  .brand-mark {
    width: 30px; height: 30px; border-radius: 9px;
    background: linear-gradient(135deg, var(--accent), var(--accent-hover));
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 0.95rem; flex-shrink: 0;
    box-shadow: var(--shadow);
  }
  h1 { font-size: 1.35rem; margin: 0; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 0.83rem; margin: 4px 0 22px 40px; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: border-color 0.15s ease, box-shadow 0.15s ease, transform 0.15s ease, background 0.2s ease;
  }

  .form-title { font-weight: 700; font-size: 1rem; margin: 0 0 12px; }

  button {
    font: inherit;
    border: none;
    border-radius: 8px;
    padding: 9px 15px;
    cursor: pointer;
    background: var(--accent);
    color: #fff;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: background 0.15s ease, transform 0.08s ease, box-shadow 0.15s ease;
  }
  button:hover { background: var(--accent-hover); }
  button:active { transform: translateY(1px); }
  button.secondary { background: transparent; color: var(--muted); border: 1px solid var(--border); }
  button.secondary:hover { background: var(--hover-bg); color: var(--text); }
  button.secondary.active { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
  button.danger { background: var(--danger); }
  button.danger:hover { background: var(--danger-hover); }
  button:disabled { opacity: 0.45; cursor: default; transform: none; }
  .spinner {
    width: 13px; height: 13px;
    border: 2px solid currentColor;
    border-top-color: transparent;
    border-radius: 50%;
    display: inline-block;
    animation: spin 0.6s linear infinite;
    flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  input, textarea, select {
    width: 100%;
    font: inherit;
    padding: 9px 11px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--input-bg);
    color: var(--text);
    margin-bottom: 8px;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  input:focus, textarea:focus, select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  textarea { resize: vertical; min-height: 70px; }
  select { width: auto; flex-shrink: 0; cursor: pointer; }

  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .row > * { flex: 1; }

  .top-actions { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }

  .post-item { cursor: pointer; position: relative; padding-right: 44px; }
  .post-item:hover { border-color: var(--accent); box-shadow: var(--shadow-hover); transform: translateY(-1px); background: var(--card-hover); }
  .post-title { font-weight: 650; margin: 0 0 5px; letter-spacing: -0.01em; }
  .post-meta { font-size: 0.78rem; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .post-excerpt { margin: 9px 0 0; color: var(--muted); font-size: 0.88rem; white-space: pre-wrap; line-height: 1.5; }
  .post-arrow {
    position: absolute; top: 20px; right: 18px;
    color: var(--muted);
    opacity: 0;
    transform: translateX(-4px);
    transition: opacity 0.15s ease, transform 0.15s ease;
  }
  .post-item:hover .post-arrow { opacity: 1; transform: translateX(0); color: var(--accent); }

  .post-stats { display: flex; align-items: center; gap: 12px; margin-top: 10px; }
  .stat { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); font-size: 0.78rem; }
  .like-btn {
    display: inline-flex; align-items: center; gap: 4px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 0.78rem;
  }
  .like-btn:hover { background: var(--hover-bg); color: var(--text); border-color: var(--border); }
  .like-btn.liked { color: var(--danger); border-color: var(--danger); background: transparent; }
  .like-btn.liked svg { fill: var(--danger); }
  .like-btn.liked:hover { background: transparent; }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .post-item { animation: cardIn 0.3s ease backwards; }

  .avatar {
    width: 20px; height: 20px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 0.68rem; font-weight: 700; color: #fff; flex-shrink: 0;
  }

  .detail-title { font-size: 1.25rem; font-weight: 700; margin: 0 0 6px; letter-spacing: -0.01em; }
  .detail-content { white-space: pre-wrap; margin: 14px 0; line-height: 1.6; }
  .detail-actions { display: flex; gap: 8px; margin-top: 10px; }

  .comments-heading { font-size: 0.95rem; font-weight: 700; margin: 22px 0 10px; }
  .comment { border: 1px solid var(--border); border-radius: 10px; padding: 11px 13px; margin-bottom: 8px; background: var(--card); box-shadow: var(--shadow); }
  .comment-head { display: flex; align-items: center; gap: 6px; font-size: 0.8rem; color: var(--muted); margin-bottom: 6px; }
  .comment-head .c-date { margin-left: auto; }
  .comment-body { font-size: 0.92rem; white-space: pre-wrap; line-height: 1.5; }
  .comment-actions { display: flex; gap: 6px; margin-top: 8px; }
  .comment-actions button { padding: 4px 10px; font-size: 0.78rem; }

  .empty {
    color: var(--muted);
    text-align: center;
    padding: 36px 0;
    font-size: 0.9rem;
    border: 1px dashed var(--border);
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .empty svg { color: var(--border); }
  .error { color: var(--danger); font-size: 0.85rem; margin: 6px 0; }
  [hidden] { display: none !important; }

  .auth-bar { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; margin-bottom: 20px; }
  .auth-bar .who { color: var(--muted); margin-right: auto; }
  .auth-bar button { padding: 6px 12px; font-size: 0.82rem; }

  .search-bar { display: flex; gap: 8px; margin-bottom: 16px; }
  .search-bar input, .search-bar select { margin-bottom: 0; }
  .search-bar button { flex-shrink: 0; padding: 8px 16px; }

  .pagination { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 22px; font-size: 0.85rem; }
  .pagination button { padding: 7px 10px; }
  .page-numbers { display: flex; align-items: center; gap: 4px; }
  .page-numbers button {
    min-width: 34px;
    padding: 6px 0;
    background: transparent;
    color: var(--muted);
    border: 1px solid transparent;
  }
  .page-numbers button:hover { background: var(--hover-bg); color: var(--text); }
  .page-numbers button.active { background: var(--accent); color: #fff; }
  .page-numbers button.active:hover { background: var(--accent); }
  .page-ellipsis { color: var(--muted); padding: 0 2px; }

  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  #login-form:not([hidden]), #register-form:not([hidden]), #new-post-form:not([hidden]) {
    animation: slideDown 0.15s ease;
  }

  .post-excerpt {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* ---------- 토스트 알림 ---------- */
  .toast-stack {
    position: fixed;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1000;
    display: flex;
    flex-direction: column;
    gap: 8px;
    align-items: center;
    width: 100%;
    pointer-events: none;
  }
  .toast {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--text);
    color: var(--bg);
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 0.85rem;
    box-shadow: var(--shadow-hover);
    opacity: 0;
    transform: translateY(-10px);
    transition: opacity 0.2s ease, transform 0.2s ease;
    max-width: 90vw;
  }
  .toast svg { flex-shrink: 0; }
  .toast.error { background: var(--danger); color: #fff; }
  .toast.show { opacity: 1; transform: translateY(0); }

  /* ---------- 확인 모달 ---------- */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(15, 15, 12, 0.42);
    display: flex; align-items: center; justify-content: center;
    z-index: 999;
    opacity: 0;
    transition: opacity 0.15s ease;
    padding: 16px;
  }
  .modal-overlay.show { opacity: 1; }
  .modal-box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    max-width: 360px;
    width: 100%;
    box-shadow: var(--shadow-hover);
    transform: scale(0.96) translateY(4px);
    transition: transform 0.15s ease;
  }
  .modal-overlay.show .modal-box { transform: scale(1) translateY(0); }
  .modal-message { margin: 0 0 16px; font-size: 0.94rem; line-height: 1.5; }

  /* ---------- 목록 스켈레톤 ---------- */
  .skeleton-card { padding: 18px; }
  .skeleton-line {
    height: 12px;
    border-radius: 6px;
    background: linear-gradient(90deg, var(--hover-bg) 25%, var(--border) 37%, var(--hover-bg) 63%);
    background-size: 400% 100%;
    animation: skeleton-shimmer 1.4s ease infinite;
    margin-bottom: 8px;
  }
  .skeleton-line.w-60 { width: 60%; height: 15px; }
  .skeleton-line.w-30 { width: 30%; height: 10px; }
  .skeleton-line.w-90 { width: 90%; }
  @keyframes skeleton-shimmer {
    0% { background-position: 100% 0; }
    100% { background-position: -100% 0; }
  }
</style>
</head>
<body>
<div class="toast-stack" id="toast-stack"></div>
<div class="wrap">
  <div class="auth-bar">
    <span class="who" id="auth-who"></span>
    <button class="secondary" id="btn-login">로그인</button>
    <button class="secondary" id="btn-register">회원가입</button>
    <button class="secondary" id="btn-change-password" hidden>비밀번호 변경</button>
    <button class="secondary" id="btn-logout" hidden>로그아웃</button>
  </div>

  <!-- 로그인 폼 -->
  <div class="card" id="login-form" hidden>
    <div class="form-title">로그인</div>
    <input id="login-username" placeholder="아이디">
    <input id="login-password" type="password" placeholder="비밀번호">
    <div class="error" id="login-error" hidden></div>
    <div class="row">
      <button id="login-submit">로그인</button>
      <button class="secondary" id="login-cancel">취소</button>
    </div>
  </div>

  <!-- 비밀번호 변경 폼 -->
  <div class="card" id="change-password-form" hidden>
    <div class="form-title">비밀번호 변경</div>
    <input id="current-password" type="password" placeholder="현재 비밀번호">
    <input id="new-password" type="password" placeholder="새 비밀번호 (8자 이상)">
    <input id="new-password-confirm" type="password" placeholder="새 비밀번호 확인">
    <div class="error" id="change-password-error" hidden></div>
    <div class="row">
      <button id="change-password-submit">변경하기</button>
      <button class="secondary" id="change-password-cancel">취소</button>
    </div>
  </div>

  <!-- 회원가입 폼 -->
  <div class="card" id="register-form" hidden>
    <div class="form-title">회원가입</div>
    <input id="register-username" placeholder="아이디 (4자 이상)">
    <input id="register-password" type="password" placeholder="비밀번호 (8자 이상)">
    <div class="error" id="register-error" hidden></div>
    <div class="row">
      <button id="register-submit">가입하기</button>
      <button class="secondary" id="register-cancel">취소</button>
    </div>
  </div>

  <div class="top-actions">
    <div>
      <div class="brand">
        <div class="brand-mark">B</div>
        <h1>게시판</h1>
      </div>
      <div class="sub">Post / Comment CRUD 데모</div>
    </div>
    <button id="btn-new-post">글쓰기</button>
  </div>

  <!-- 새 글 작성 폼 -->
  <div class="card" id="new-post-form" hidden>
    <div class="form-title">새 글 작성</div>
    <input id="new-post-title" placeholder="제목" maxlength="200">
    <textarea id="new-post-content" placeholder="내용"></textarea>
    <div class="error" id="new-post-error" hidden></div>
    <div class="row">
      <button id="new-post-submit">등록</button>
      <button class="secondary" id="new-post-cancel">취소</button>
    </div>
  </div>

  <!-- 목록 화면 -->
  <div id="view-list">
    <div class="search-bar">
      <input id="search-keyword" placeholder="제목·본문으로 검색">
      <button class="secondary" id="search-submit">검색</button>
      <button class="secondary" id="search-clear" hidden>초기화</button>
      <select id="sort-select">
        <option value="latest">최신순</option>
        <option value="oldest">오래된순</option>
        <option value="title">제목순</option>
        <option value="popular">인기순</option>
      </select>
      <button class="secondary" id="mine-toggle" hidden aria-pressed="false">내가 쓴 글만</button>
    </div>
    <div id="post-list"></div>
    <div class="pagination" id="pagination" hidden>
      <button class="secondary" id="page-prev" aria-label="이전 페이지"></button>
      <div class="page-numbers" id="page-numbers"></div>
      <button class="secondary" id="page-next" aria-label="다음 페이지"></button>
    </div>
  </div>

  <!-- 상세 화면 -->
  <div id="view-detail" hidden>
    <button class="secondary" id="btn-back">← 목록으로</button>

    <div class="card" id="detail-card"></div>

    <div class="comments-heading">댓글</div>
    <div id="comment-list"></div>
    <button class="secondary" id="comment-load-more" hidden style="width:100%; margin-bottom:12px;">댓글 더 보기</button>

    <div class="card">
      <textarea id="comment-content" placeholder="댓글 내용" rows="2"></textarea>
      <div class="error" id="comment-error" hidden></div>
      <button id="comment-submit">댓글 등록</button>
    </div>
  </div>
</div>

<script>
// ---------- 인증 상태 ----------
function getAccessToken() { return localStorage.getItem('accessToken'); }
function getRefreshToken() { return localStorage.getItem('refreshToken'); }
function getUsername() { return localStorage.getItem('username'); }
function setAuth(accessToken, refreshToken, username) {
  localStorage.setItem('accessToken', accessToken);
  localStorage.setItem('refreshToken', refreshToken);
  localStorage.setItem('username', username);
}
function clearAuth() {
  localStorage.removeItem('accessToken');
  localStorage.removeItem('refreshToken');
  localStorage.removeItem('username');
}
function authHeaders() {
  const token = getAccessToken();
  return token ? { 'Authorization': `Bearer ${token}` } : {};
}

// 리프레시 토큰으로 액세스 토큰을 재발급받는다. 실패하면(리프레시 토큰도 만료) 로그아웃 상태로 되돌린다.
async function tryRefreshAccessToken() {
  const refreshToken = getRefreshToken();
  if (!refreshToken) return false;

  const res = await fetch('/api/auth/refresh', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ refreshToken }),
  });
  if (!res.ok) {
    clearAuth();
    return false;
  }
  const data = await res.json();
  setAuth(data.accessToken, data.refreshToken, data.username);
  return true;
}

// 인증이 필요한 요청 전용: 액세스 토큰이 만료(401)되면 리프레시 토큰으로 한 번 재시도한다.
async function authFetch(url, options = {}) {
  const doFetch = () => fetch(url, { ...options, headers: { ...(options.headers || {}), ...authHeaders() } });

  let res = await doFetch();
  if (res.status === 401 && getRefreshToken()) {
    if (await tryRefreshAccessToken()) {
      res = await doFetch();
    } else {
      renderAuthBar();
    }
  }
  return res;
}

const api = {
  posts: (page, size, keyword, sort, mine) => {
    const params = new URLSearchParams({ page, size, sort });
    if (keyword) params.set('keyword', keyword);
    if (mine) params.set('mine', 'true');
    // authFetch를 쓰면 로그인 상태일 때 토큰이 함께 실려가, 서버가 내가 각 글에
    // 좋아요를 눌렀는지(likedByMe)까지 함께 계산해 내려준다. 비로그인이면 평소처럼 동작한다.
    return authFetch(`/api/posts?${params}`).then(r => r.json());
  },
  post: (id) => authFetch(`/api/posts/${id}`).then(r => r.json()),
  createPost: (body) => authFetch('/api/posts', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) }),
  updatePost: (id, body) => authFetch(`/api/posts/${id}`, { method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) }),
  deletePost: (id) => authFetch(`/api/posts/${id}`, { method: 'DELETE' }),
  toggleLike: (id) => authFetch(`/api/posts/${id}/like`, { method: 'POST' }),
  comments: (postId, page, size) => fetch(`/api/posts/${postId}/comments?page=${page}&size=${size}`).then(r => r.json()),
  createComment: (postId, body) => authFetch(`/api/posts/${postId}/comments`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) }),
  updateComment: (id, body) => authFetch(`/api/comments/${id}`, { method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) }),
  deleteComment: (id) => authFetch(`/api/comments/${id}`, { method: 'DELETE' }),
  register: (body) => fetch('/api/auth/register', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) }),
  login: (body) => fetch('/api/auth/login', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) }),
  logout: (refreshToken) => fetch('/api/auth/logout', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ refreshToken }) }),
};

const el = (id) => document.getElementById(id);
let currentPostId = null;
const PAGE_SIZE = 10;
let currentPage = 0;

// ---------- 토스트 / 확인 모달 (native alert·confirm 대체) ----------
function showToast(message, type = 'success') {
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  const icon = document.createElement('span');
  icon.innerHTML = type === 'error' ? ICONS.alertCircle : ICONS.checkCircle;
  const text = document.createElement('span');
  text.textContent = message;
  toast.appendChild(icon);
  toast.appendChild(text);
  el('toast-stack').appendChild(toast);
  requestAnimationFrame(() => toast.classList.add('show'));
  setTimeout(() => {
    toast.classList.remove('show');
    setTimeout(() => toast.remove(), 200);
  }, 2600);
}

function showConfirm(message) {
  return new Promise((resolve) => {
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal-box">
        <p class="modal-message"></p>
        <div class="row">
          <button class="danger" data-action="ok">삭제</button>
          <button class="secondary" data-action="cancel">취소</button>
        </div>
      </div>
    `;
    overlay.querySelector('.modal-message').textContent = message;
    document.body.appendChild(overlay);
    requestAnimationFrame(() => overlay.classList.add('show'));

    const cleanup = (result) => {
      overlay.classList.remove('show');
      setTimeout(() => overlay.remove(), 150);
      resolve(result);
    };
    overlay.querySelector('[data-action="ok"]').addEventListener('click', () => cleanup(true));
    overlay.querySelector('[data-action="cancel"]').addEventListener('click', () => cleanup(false));
    overlay.addEventListener('click', (e) => { if (e.target === overlay) cleanup(false); });
  });
}

// 버튼을 눌러 비동기 요청을 보내는 동안 그 버튼을 비활성화하고 문구를 바꿔둔다.
// 안 하면 응답이 오기 전에 같은 버튼을 빠르게 두 번 눌러 요청이 중복으로 나갈 수 있다.
async function withLoading(button, label, fn) {
  const original = button.innerHTML;
  button.disabled = true;
  button.innerHTML = `<span class="spinner"></span>${label}`;
  try {
    await fn();
  } finally {
    button.disabled = false;
    button.innerHTML = original;
  }
}

function fmt(dateStr) {
  if (!dateStr) return '';
  return dateStr.replace('T', ' ').slice(0, 16);
}

const AVATAR_COLORS = ['#2f6f4f', '#3a6ea5', '#a0522d', '#6a4c93', '#c9622a', '#1f7a72', '#8a3f5a'];
function avatarColor(name) {
  let hash = 0;
  for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
  return AVATAR_COLORS[Math.abs(hash) % AVATAR_COLORS.length];
}
function makeAvatar(name) {
  const span = document.createElement('span');
  span.className = 'avatar';
  span.style.background = avatarColor(name || '');
  span.textContent = (name || '?').trim().charAt(0).toUpperCase();
  return span;
}

async function readError(res, fallback) {
  try {
    const data = await res.json();
    return data.message || fallback;
  } catch {
    return fallback;
  }
}

      errBox.hidden = false;
    }
  });
});

async function loadList(page = currentPage) {
  el('view-detail').hidden = true;
  el('view-list').hidden = false;
  const list = el('post-list');
  const pagination = el('pagination');
  list.innerHTML = Array.from({ length: 3 }).map(() => `
    <div class="card skeleton-card">
      <div class="skeleton-line w-60"></div>
      <div class="skeleton-line w-30"></div>
      <div class="skeleton-line w-90"></div>
    </div>
  `).join('');
  pagination.hidden = true;

  try {
    const result = await api.posts(page, PAGE_SIZE, currentKeyword, currentSort, currentMine);
    currentPage = result.page;

    if (result.content.length === 0) {
      const emptyMessage = currentKeyword
        ? '검색 결과가 없습니다.'
        : (currentMine ? '아직 작성한 게시글이 없습니다.' : '아직 게시글이 없습니다.');
      list.innerHTML = `<div class="empty">${ICONS.inbox}${emptyMessage}</div>`;
      return;
    }
    list.innerHTML = '';
    result.content.forEach((post, index) => {
      const item = document.createElement('div');
      item.className = 'card post-item';
      item.style.animationDelay = `${Math.min(index * 40, 200)}ms`;
      item.innerHTML = `
        <p class="post-title"></p>
        <p class="post-meta"></p>
        <p class="post-excerpt"></p>
        <div class="post-stats">
          <button class="like-btn"></button>
          <span class="stat">${ICONS.message}<span></span></span>
          <span class="stat">${ICONS.eye}<span></span></span>
        </div>
        <span class="post-arrow">${ICONS.arrowRight}</span>
      `;
      item.querySelector('.post-title').textContent = post.title;
      const meta = item.querySelector('.post-meta');
      meta.appendChild(makeAvatar(post.author));
      const metaText = document.createElement('span');
      metaText.textContent = `${post.author} · ${fmt(post.createdAt)}`;
      meta.appendChild(metaText);
      item.querySelector('.post-excerpt').textContent = post.content;
      item.querySelectorAll('.stat span')[1].textContent = post.viewCount;

      const likeBtn = item.querySelector('.like-btn');
      renderLikeButton(likeBtn, post.likeCount, post.likedByMe);
      likeBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        handleLikeClick(likeBtn, post.id);
      });
      item.querySelector('.stat span').textContent = post.commentCount;

      item.addEventListener('click', () => openDetail(post.id));
      list.appendChild(item);
    });

    if (result.totalPages > 1) {
      pagination.hidden = false;
      renderPageNumbers(result.page, result.totalPages);
      el('page-prev').disabled = result.page === 0;
      el('page-next').disabled = result.page >= result.totalPages - 1;
    }
  } catch (e) {
    list.innerHTML = '<div class="error">목록을 불러오지 못했습니다.</div>';
  }
}

async function handleLikeClick(btn, postId) {
  if (!getUsername()) {
    showToast('로그인이 필요합니다.', 'error');
    el('btn-login').click();
    return;
  }
  btn.disabled = true;
  try {
    const res = await api.toggleLike(postId);
    if (res.ok) {
      const data = await res.json();
      renderLikeButton(btn, data.likeCount, data.likedByMe);
    } else {
      showToast(await readError(res, '처리에 실패했습니다.'), 'error');
    }
  } finally {
    btn.disabled = false;
  }
}

// 페이지가 많아질 걸 대비해, 전부 나열하지 않고 현재 페이지 주변 + 처음/끝만 보여주고
// 나머지는 "…"으로 생략한다 (7페이지 이하면 그냥 전부 보여준다).
function renderPageNumbers(current, total) {
  const container = el('page-numbers');
  container.innerHTML = '';

  const addPageButton = (p) => {
    const btn = document.createElement('button');
    btn.className = 'secondary' + (p === current ? ' active' : '');
    btn.textContent = p + 1;
    btn.addEventListener('click', () => loadList(p));
    container.appendChild(btn);
  };
  const addEllipsis = () => {
    const span = document.createElement('span');
    span.className = 'page-ellipsis';
    span.textContent = '…';
    container.appendChild(span);
  };

  if (total <= 7) {
    for (let p = 0; p < total; p++) addPageButton(p);
    return;
  }

  addPageButton(0);
  if (current > 2) addEllipsis();
  for (let p = Math.max(1, current - 1); p <= Math.min(total - 2, current + 1); p++) addPageButton(p);
  if (current < total - 3) addEllipsis();
  addPageButton(total - 1);
}

// ---------- 상세 화면 ----------
// 브라우저 뒤로가기가 앱 안의 "목록으로"처럼 동작하도록 History API를 쓴다.
// 목록 ↔ 상세 사이를 옮길 때마다(버튼 클릭이든 뒤로가기든) 매번 새 기록을 남긴다.
// "← 목록으로" 버튼을 history.back()으로만 처리하면, 그 상태에서 다른 글을
// 새로 클릭하는 순간 브라우저가 "뒤로 갔던 지점 이후의 기록"을 전부 지워버려
// (표준 브라우저 동작) 목록→글A→목록→글B로 이동한 뒤 뒤로가기를 반복하면
// 글A로는 못 돌아가고 앱을 빠져나가버린다. 그래서 "목록으로"도 뒤로가기 대신
// pushState로 자기 자리를 스스로 기록해, 뒤로가기를 누를 때마다 지나온 화면을
// 순서대로 그대로 되짚어가게 한다. popstate(실제 뒤로/앞으로가기)로 들어올 때는
// 이미 있는 기록을 보고 그리는 것뿐이므로 다시 push하지 않는다(push:false).
el('btn-back').addEventListener('click', () => showListView());

function showListView({ push = true } = {}) {
  el('view-detail').hidden = true;
  el('new-post-form').hidden = true;
  el('view-list').hidden = false;
  if (push) history.pushState({ view: 'list' }, '', '#/');
  loadList();
}

async function openDetail(id, { push = true } = {}) {
  currentPostId = id;
  el('view-list').hidden = true;
  el('new-post-form').hidden = true;
  el('view-detail').hidden = false;
  if (push) history.pushState({ view: 'detail', id }, '', `#/posts/${id}`);

  // 이전에 보던 글/댓글이 새 데이터가 도착할 때까지 화면에 그대로 남아있으면
  // ("잔상") 다른 글을 눌렀는데 잠깐 엉뚱한 내용이 보이는 것처럼 느껴진다.
  // fetch를 시작하기 전에 먼저 스켈레톤으로 비워둔다.
  el('detail-card').innerHTML = `
    <div class="skeleton-line w-60" style="height:20px;"></div>
    <div class="skeleton-line w-30"></div>
    <div class="skeleton-line w-90"></div>
    <div class="skeleton-line w-90"></div>
  `;
  el('comment-list').innerHTML = '<div class="empty">불러오는 중...</div>';
  el('comment-load-more').hidden = true;

  // 글 내용과 댓글은 서로 무관한 요청이라, 순서대로 기다리지 않고 동시에 가져와
  // 체감 대기 시간을 줄인다.
  await Promise.all([renderDetail(), renderComments()]);
}

window.addEventListener('popstate', (e) => {
  const state = e.state;
  if (state && state.view === 'detail') {
    openDetail(state.id, { push: false });
  } else if (state && state.view === 'new-post') {
    showNewPostForm({ push: false });
  } else {
    showListView({ push: false });
  }
});

async function renderDetail() {
  const post = await api.post(currentPostId);
  const card = el('detail-card');
  card.innerHTML = `
    <p class="detail-title"></p>
    <p class="post-meta"></p>
    <div class="detail-content"></div>
    <div class="post-stats">
      <button class="like-btn" id="detail-like-btn"></button>
      <span class="stat">${ICONS.message}<span id="detail-comment-count"></span></span>
      <span class="stat">${ICONS.eye}<span id="detail-view-count"></span></span>
    </div>
    <div class="detail-actions">
      <button class="secondary" id="btn-edit-post">${ICONS.edit}수정</button>
      <button class="danger" id="btn-delete-post">${ICONS.trash}삭제</button>
    </div>
  `;
  card.querySelector('.detail-title').textContent = post.title;
  const detailMeta = card.querySelector('.post-meta');
  detailMeta.appendChild(makeAvatar(post.author));
  const detailMetaText = document.createElement('span');
  detailMetaText.textContent = `${post.author} · 작성 ${fmt(post.createdAt)} · 수정 ${fmt(post.updatedAt)}`;
  detailMeta.appendChild(detailMetaText);
  card.querySelector('.detail-content').textContent = post.content;

  const detailLikeBtn = card.querySelector('#detail-like-btn');
  renderLikeButton(detailLikeBtn, post.likeCount, post.likedByMe);
  detailLikeBtn.addEventListener('click', () => handleLikeClick(detailLikeBtn, post.id));
  card.querySelector('#detail-comment-count').textContent = post.commentCount;
  card.querySelector('#detail-view-count').textContent = post.viewCount;

  const isOwner = getUsername() === post.author;
  card.querySelector('#btn-edit-post').hidden = !isOwner;
  card.querySelector('#btn-delete-post').hidden = !isOwner;

  card.querySelector('#btn-delete-post').addEventListener('click', async () => {
    if (!(await showConfirm('게시글을 삭제하시겠습니까? 댓글도 함께 삭제됩니다.'))) return;
    const res = await api.deletePost(post.id);
    if (res.ok) {
      showToast('게시글이 삭제되었습니다.');
      loadList();
    } else {
      showToast(await readError(res, '삭제에 실패했습니다.'), 'error');
    }
  });

  card.querySelector('#btn-edit-post').addEventListener('click', () => {
    card.innerHTML = `
      <input id="edit-title" value="${post.title.replace(/"/g,'&quot;')}">
      <textarea id="edit-content"></textarea>
      <div class="error" id="edit-error" hidden></div>
      <div class="row">
        <button id="edit-submit">저장</button>
        <button class="secondary" id="edit-cancel">취소</button>
      </div>
    `;
    card.querySelector('#edit-content').value = post.content;
    card.querySelector('#edit-cancel').addEventListener('click', renderDetail);
    card.querySelector('#edit-submit').addEventListener('click', async (e) => {
      const title = card.querySelector('#edit-title').value.trim();
      const content = card.querySelector('#edit-content').value.trim();
      await withLoading(e.target, '저장 중...', async () => {
        const res = await api.updatePost(post.id, { title, content });
        if (res.ok) {
          renderDetail();
        } else {
          const errBox = card.querySelector('#edit-error');
          errBox.textContent = await readError(res, '수정에 실패했습니다.');
          errBox.hidden = false;
        }
      });
    });
  });
}

// ---------- 댓글 ----------
// 댓글은 작성순(오래된 것부터) 정렬이라, "더 보기"를 누를수록 최신 댓글 쪽으로 내려간다.
// 그래서 수정/삭제/새 댓글 작성은 전체를 다시 불러오지 않고, 화면에서 바로 반영한다.
const COMMENT_PAGE_SIZE = 10;
let commentPage = 0;

function buildCommentItem(c) {
  const item = document.createElement('div');
  item.className = 'comment';
  item.innerHTML = `
    <div class="comment-head">
      <span class="c-author"></span>
      <span class="c-date"></span>
    </div>
    <div class="comment-body"></div>
    <div class="comment-actions">
      <button class="secondary" data-action="edit">${ICONS.edit}수정</button>
      <button class="danger" data-action="delete">${ICONS.trash}삭제</button>
    </div>
  `;
  item.querySelector('.comment-head').insertBefore(makeAvatar(c.author), item.querySelector('.c-author'));
  item.querySelector('.c-author').textContent = c.author;
  item.querySelector('.c-date').textContent = fmt(c.createdAt);
  item.querySelector('.comment-body').textContent = c.content;

  const isOwner = getUsername() === c.author;
  item.querySelector('[data-action="edit"]').hidden = !isOwner;
  item.querySelector('[data-action="delete"]').hidden = !isOwner;

  item.querySelector('[data-action="delete"]').addEventListener('click', async () => {
    if (!(await showConfirm('댓글을 삭제하시겠습니까?'))) return;
    const res = await api.deleteComment(c.id);
    if (res.ok) {
      item.remove();
      bumpCommentCount(-1);
      if (!el('comment-list').children.length) {
        el('comment-list').innerHTML = '<div class="empty">첫 댓글을 남겨보세요.</div>';
      }
    } else {
      showToast(await readError(res, '삭제에 실패했습니다.'), 'error');
    }
  });

  item.querySelector('[data-action="edit"]').addEventListener('click', () => {
    const body = item.querySelector('.comment-body');
    body.innerHTML = `
      <textarea id="edit-c-${c.id}" rows="2"></textarea>
      <div class="row" style="margin-top:6px;">
        <button data-action="save">저장</button>
        <button class="secondary" data-action="cancel">취소</button>
      </div>
    `;
    body.querySelector(`#edit-c-${c.id}`).value = c.content;
    body.querySelector('[data-action="cancel"]').addEventListener('click', () => {
      body.textContent = c.content;
    });
    body.querySelector('[data-action="save"]').addEventListener('click', async (e) => {
      const content = body.querySelector(`#edit-c-${c.id}`).value.trim();
      await withLoading(e.target, '저장 중...', async () => {
        const res = await api.updateComment(c.id, { content });
        if (res.ok) {
          c.content = content;
          body.textContent = content;
        } else {
          showToast(await readError(res, '수정에 실패했습니다.'), 'error');
        }
      });
    });
  });

  return item;
}

async function renderComments() {
  commentPage = 0;
  const list = el('comment-list');
  const loadMoreBtn = el('comment-load-more');
  list.innerHTML = '<div class="empty">불러오는 중...</div>';
  loadMoreBtn.hidden = true;

  const result = await api.comments(currentPostId, commentPage, COMMENT_PAGE_SIZE);

  list.innerHTML = '';
  if (result.content.length === 0) {
    list.innerHTML = '<div class="empty">첫 댓글을 남겨보세요.</div>';
  } else {
    result.content.forEach(c => list.appendChild(buildCommentItem(c)));
  }
  loadMoreBtn.hidden = commentPage + 1 >= result.totalPages;
}

el('comment-load-more').addEventListener('click', async () => {
  commentPage++;
  const result = await api.comments(currentPostId, commentPage, COMMENT_PAGE_SIZE);
  result.content.forEach(c => el('comment-list').appendChild(buildCommentItem(c)));
  el('comment-load-more').hidden = commentPage + 1 >= result.totalPages;
});

el('comment-submit').addEventListener('click', async (e) => {
  if (!getUsername()) {
    showToast('로그인이 필요합니다.', 'error');
    el('btn-login').click();
    return;
  }
  const content = el('comment-content').value.trim();
  const errBox = el('comment-error');
  errBox.hidden = true;

  await withLoading(e.target, '등록 중...', async () => {
  const res = await api.createComment(currentPostId, { content });
  if (res.ok) {
    const created = await res.json();
    el('comment-content').value = '';
    const list = el('comment-list');
    if (list.querySelector('.empty')) list.innerHTML = '';
    list.appendChild(buildCommentItem(created));
    bumpCommentCount(1);
  } else {
    errBox.textContent = await readError(res, '댓글 등록에 실패했습니다.');
    errBox.hidden = false;
  }
  });
});

// 초기 진입: 목록 상태를 히스토리 바닥에 깔아둔 뒤(뒤로가기의 최종 목적지가 되도록),
// URL에 #/posts/{id}가 있으면 그 글 상세로 바로 연다 (딥링크).
// replaceState로 해시를 덮어쓰기 전에 원래 해시를 먼저 읽어둬야 한다.
const initialDetailMatch = location.hash.match(/^#\/posts\/(\d+)$/);
history.replaceState({ view: 'list' }, '', '#/');
if (initialDetailMatch) {
  openDetail(Number(initialDetailMatch[1]));
} else {
  loadList();
}
</script>
</body>
</html>
