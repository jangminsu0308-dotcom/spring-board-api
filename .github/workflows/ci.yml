name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: springdb
          MYSQL_USER: springuser
          MYSQL_PASSWORD: springpass
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: JDK 21 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 테스트 실행
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/springdb?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
          SPRING_DATASOURCE_USERNAME: springuser
          SPRING_DATASOURCE_PASSWORD: springpass
          SPRING_JPA_HIBERNATE_DDL_AUTO: validate
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRATION_MS: 3600000
          JWT_REFRESH_EXPIRATION_MS: 604800000
        run: ./mvnw test

      - name: 테스트 리포트 업로드 (실패 시 확인용)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: self-hosted

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          clean: false  # .env(운영 시크릿)가 워크스페이스에 남아있어야 하므로 지우지 않는다

      - name: 컨테이너 재배포
        run: docker compose -f docker-compose.prod.yml up -d --build

      - name: 배포 실패 알림
        if: failure()
        run: |
          curl -s -H "Title: spring-board-api 배포 실패" -H "Priority: high" \
            -d "커밋 ${{ github.sha }} 배포 실패. Actions 로그 확인 필요." \
            "https://ntfy.sh/${{ secrets.NTFY_TOPIC }}"
