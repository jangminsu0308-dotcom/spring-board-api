name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: springdb
          MYSQL_USER: springuser
          MYSQL_PASSWORD: springpass
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: JDK 21 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 테스트 실행
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/springdb?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
          SPRING_DATASOURCE_USERNAME: springuser
          SPRING_DATASOURCE_PASSWORD: springpass
          SPRING_JPA_HIBERNATE_DDL_AUTO: validate
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRATION_MS: 3600000
          JWT_REFRESH_EXPIRATION_MS: 604800000
        run: ./mvnw test

      - name: 테스트 리포트 업로드 (실패 시 확인용)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node 설치
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: 앱 스택 기동 (docker compose, mysql+app; Dockerfile 안에서 자체적으로 Maven 빌드)
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: docker compose up -d --build

      - name: 앱이 뜰 때까지 대기
        run: |
          for i in $(seq 1 40); do
            if curl -sf "http://localhost:8080/api/posts?page=0&size=1" > /dev/null; then
              echo "앱이 준비됐습니다."
              exit 0
            fi
            sleep 3
          done
          echo "앱이 제한 시간 안에 뜨지 않았습니다."
          docker compose logs app
          exit 1

      - name: Playwright 설치
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: E2E 테스트 실행
        working-directory: e2e
        run: npx playwright test

      - name: 테스트 리포트 업로드 (실패 시 확인용)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/

      - name: 앱 로그 업로드 (실패 시 확인용)
        if: failure()
        run: docker compose logs app > app.log
      - name: 앱 로그 첨부
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-logs
          path: app.log

      - name: 컨테이너 정리
        if: always()
        run: docker compose down -v

  deploy:
    # e2e는 배포를 막지 않는다 — GitHub Actions 호스트 러너에서 도커 컴포즈로 앱 전체를
    # 띄우는 잡이라 인프라 쪽 변수(네트워크, 이미지 빌드 시간 등)가 test보다 많다. 당장은
    # 병행 실행해 신호로만 쓰고, 충분히 안정적이라고 확인되면 이후에 게이트로 올린다.
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: self-hosted

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          clean: false  # .env(운영 시크릿)가 워크스페이스에 남아있어야 하므로 지우지 않는다

      - name: 컨테이너 재배포
        run: docker compose -f docker-compose.prod.yml up -d --build

      - name: 배포 실패 알림
        if: failure()
        run: |
          curl -s -H "Title: spring-board-api 배포 실패" -H "Priority: high" \
            -d "커밋 ${{ github.sha }} 배포 실패. Actions 로그 확인 필요." \
            "https://ntfy.sh/${{ secrets.NTFY_TOPIC }}"
